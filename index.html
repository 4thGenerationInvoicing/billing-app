})();

// ==================================================================
// PDF — jsPDF + autotable (lazy-load), no status line, new bottom block
// ==================================================================
function invLoadPdfLibs() {
  if (pdfLibsLoading) return pdfLibsLoading;
  pdfLibsLoading = new Promise((resolve, reject) => {
    const s1 = document.createElement('script');
    s1.src = 'https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js';
    s1.onload = () => {
      const s2 = document.createElement('script');
      s2.src = 'https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js';
      s2.onload = resolve; s2.onerror = reject;
      document.head.appendChild(s2);
    };
    s1.onerror = reject;
    document.head.appendChild(s1);
  });
  return pdfLibsLoading;
}

async function invPdfButton(id, btn) {
  const v = invoiceById(id); if (!v) return;
  if (btn) { btn.disabled = true; const lbl = btn.textContent; btn.textContent = 'Building…'; }
  try {
    await invLoadPdfLibs();
    const blob = invBuildPdf(v);
    const fname = 'invoice-' + v.invoice_number + '.pdf';
    const file = new File([blob], fname, { type: 'application/pdf' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try {
        await navigator.share({ files: [file], title: 'Invoice ' + v.invoice_number,
          text: 'Invoice ' + v.invoice_number + ' from ' + INV_BUSINESS_NAME });
        return;
      } catch (err) { if (err.name === 'AbortError') return; }
    }
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = fname;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  } catch (err) {
    toast('PDF library failed to load (VPN blocking CDN?)');
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = lbl || '📄 PDF'; }
  }
}

function invBuildPdf(v) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  const cli = clientById(v.client_id);
  const items = invItemsFor(v.id);
  const sub = invSubtotal(items), ohp = invOhp(items), dep = invDeposits(items);
  const bal = invBalance(items);

  // header
  doc.setFontSize(18); doc.text(INV_BUSINESS_NAME, 14, 20);
  doc.setFontSize(11); doc.text('Invoice #' + v.invoice_number, 14, 27);
  doc.setFontSize(10);
  doc.text('Issued: ' + invMdy(v.issue_date), 200, 20, { align: 'right' });
  if (v.due_date) doc.text('Due: ' + invMdy(v.due_date), 200, 26, { align: 'right' });
  // NOTE: status intentionally NOT shown on the PDF

  // client block
  doc.setFontSize(10);
  doc.text('Billed to:', 14, 40);
  doc.setFontSize(12); doc.text(cli ? cli.name : '', 14, 46);
  doc.setFontSize(10);
  if (cli && cli.address) doc.text(doc.splitTextToSize(cli.address, 80), 14, 51);

  // table
  const rows = invGroupRows(v, items).map(r => [
    (r.label || '') + (r.sub ? '\n' + r.sub : '') + (r.notes ? '\n' + r.notes : ''),
    r.qty != null ? String(Number(r.qty).toFixed(2).replace(/\.?0+$/, '')) + (r.unit ? ' ' + r.unit : '') : '',
    r.rate != null ? fmtMoney(r.rate) : '',
    fmtMoney(r.amount),
  ]);

  doc.autoTable({
    startY: 62,
    head: [['Item', 'Qty', 'Rate', 'Amount']],
    body: rows,
    theme: 'grid',
    styles: { fontSize: 9, cellPadding: 2.5 },
    columnStyles: { 1: { halign: 'right' }, 2: { halign: 'right' }, 3: { halign: 'right' } },
  });

  // bottom block: Subtotal → O&P → Total → Less deposits → BALANCE
  let y = doc.lastAutoTable.finalY + 8;
  const tx = 196;
  doc.setFontSize(10);
  doc.text('Job cost subtotal:', tx - 60, y, { align: 'right' });
  doc.text(fmtMoney(sub), tx, y, { align: 'right' }); y += 6;
  doc.text('Overhead & Profit (' + invOhpPctSum(items) + '% of job cost):', tx - 60, y, { align: 'right' });
  doc.text(fmtMoney(ohp), tx, y, { align: 'right' }); y += 6;
  doc.setFontSize(12); doc.setFont(undefined, 'bold');
  doc.text('Total:', tx - 60, y, { align: 'right' });
  doc.text(fmtMoney(sub + ohp), tx, y, { align: 'right' });
  doc.setFont(undefined, 'normal'); doc.setFontSize(10); y += 6;
  if (dep) {
    doc.text('Less deposits received:', tx - 60, y, { align: 'right' });
    doc.text(fmtMoney(dep), tx, y, { align: 'right' }); y += 7;
  }
  doc.setFontSize(13); doc.setFont(undefined, 'bold');
  doc.text('Balance:', tx - 60, y, { align: 'right' });
  if (bal < 0) doc.setTextColor(46, 158, 91);
  doc.text(fmtMoney(bal), tx, y, { align: 'right' });
  doc.setTextColor(0, 0, 0);
  doc.setFont(undefined, 'normal'); doc.setFontSize(10); y += 10;

  if (v.requested_amount != null) {
    doc.setFontSize(13); doc.setFont(undefined, 'bold');
    doc.text('Amount requested: ' + fmtMoney(v.requested_amount), tx, y, { align: 'right' });
    doc.setFont(undefined, 'normal'); doc.setFontSize(10); y += 8;
  }
  if (v.notes) {
    doc.setFontSize(9);
    doc.text(doc.splitTextToSize(v.notes, 180), 14, y);
  }

  return doc.output('blob');
}
function invMdy(d) {
  if (!d) return '';
  const parts = String(d).split('-');
  return parts[1] + '/' + parts[2] + '/' + parts[0];
}</script>

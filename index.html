<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Freelance Billing</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root { --p:#6d4aff; --bg:#f7f7fa; --card:#fff; --text:#1a1a2e; --muted:#6b6b80; --border:#e4e4ef; --danger:#d64545; --good:#2e9e5b; }
  * { box-sizing:border-box; margin:0; padding:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; }
  body { background:var(--bg); color:var(--text); }
  .hidden { display:none !important; }

  #login-screen { max-width:380px; margin:12vh auto; background:var(--card); padding:32px; border-radius:16px; box-shadow:0 4px 24px rgba(0,0,0,.06); }
  #login-screen h1 { font-size:22px; margin-bottom:4px; }
  #login-screen p { color:var(--muted); font-size:14px; margin-bottom:24px; }
  #login-screen input { width:100%; padding:12px 14px; border:1px solid var(--border); border-radius:10px; margin-bottom:12px; font-size:15px; }
  #login-error { color:var(--danger); font-size:13px; margin-bottom:12px; min-height:16px; }

  header { background:var(--p); color:#fff; padding:14px 20px; display:flex; justify-content:space-between; align-items:center; }
  header h1 { font-size:18px; }
  #logout-btn { background:rgba(255,255,255,.15); border:none; color:#fff; padding:7px 14px; border-radius:8px; cursor:pointer; font-size:13px; }
  nav { display:flex; gap:4px; background:var(--card); border-bottom:1px solid var(--border); overflow-x:auto; padding:0 12px; }
  nav button { background:none; border:none; padding:14px 14px; font-size:14px; color:var(--muted); cursor:pointer; border-bottom:2px solid transparent; white-space:nowrap; }
  nav button.active { color:var(--p); border-bottom-color:var(--p); font-weight:600; }
  main { max-width:1000px; margin:0 auto; padding:20px 16px 80px; }
  .view-title { font-size:20px; font-weight:700; margin-bottom:16px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; }

  .btn { background:var(--p); color:#fff; border:none; padding:9px 16px; border-radius:9px; cursor:pointer; font-size:14px; font-weight:500; }
  .btn.secondary { background:var(--card); color:var(--p); border:1px solid var(--p); }
  .btn.small { padding:5px 10px; font-size:12px; border-radius:6px; }
  .btn.tiny { padding:3px 8px; font-size:11px; border-radius:5px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:16px; margin-bottom:12px; }
  input, select, textarea { padding:10px 12px; border:1px solid var(--border); border-radius:8px; font-size:14px; width:100%; background:#fff; }
  label { display:block; font-size:13px; font-weight:600; margin-bottom:4px; color:var(--muted); }
  .form-row { display:flex; gap:12px; margin-bottom:12px; flex-wrap:wrap; }
  .form-row > div { flex:1; min-width:140px; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th { text-align:left; color:var(--muted); font-size:12px; text-transform:uppercase; padding:8px; border-bottom:2px solid var(--border); }
  td { padding:10px 8px; border-bottom:1px solid var(--border); vertical-align:middle; }
  .row-actions { display:flex; gap:6px; justify-content:flex-end; }
  .empty { text-align:center; color:var(--muted); padding:40px 0; font-size:14px; }
  .toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:#1a1a2e; color:#fff; padding:10px 20px; border-radius:10px; font-size:14px; opacity:0; transition:opacity .3s; pointer-events:none; z-index:99; }
  .toast.show { opacity:1; }

  /* ---------- WEEKLY GRID ---------- */
  .week-nav { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:14px; flex-wrap:wrap; }
  .week-label { font-size:16px; font-weight:600; }
  .grid-wrap { overflow-x:auto; -webkit-overflow-scrolling:touch; }
  table.wgrid { border-collapse:separate; border-spacing:0; min-width:680px; font-size:13px; }
  table.wgrid th { padding:6px 4px; text-align:center; font-size:11px; border-bottom:2px solid var(--border); background:#fafafe; }
  table.wgrid th.rowhead { text-align:left; min-width:180px; }
  table.wgrid td { padding:0; border-bottom:1px solid var(--border); }
  table.wgrid td.rowhead { padding:8px 10px; border-right:1px solid var(--border); background:#fafafe; }
  table.wgrid td.total, table.wgrid th.total { border-left:2px solid var(--border); background:#fafafe; font-weight:600; text-align:center; padding:8px 6px; }
  .cell-input { width:100%; min-width:52px; border:none; border-radius:0; padding:9px 4px; text-align:center; font-size:13px; background:transparent; }
  .cell-input:focus { outline:2px solid var(--p); outline-offset:-2px; background:#fff; }
  .cell-input.filled { background:#f0edff; font-weight:600; }
  .today-col { background:#fbfaff; }
  .tab-switch { display:flex; gap:0; margin-bottom:16px; border:1px solid var(--border); border-radius:9px; overflow:hidden; width:fit-content; }
  .tab-switch button { background:var(--card); border:none; padding:8px 18px; font-size:13px; cursor:pointer; color:var(--muted); }
  .tab-switch button.active { background:var(--p); color:#fff; font-weight:600; }
  .close-btn { border:none; background:transparent; color:var(--muted); cursor:pointer; font-size:13px; padding:2px 6px; border-radius:4px; line-height:1; }
  .close-btn:hover { color:var(--danger); background:#fdeeee; }

  /* ---------- EXPENSES ---------- */
  .exp-cat { display:inline-block; font-size:11px; font-weight:600; padding:2px 8px; border-radius:20px; background:#f0edff; color:var(--p); text-transform:uppercase; letter-spacing:.3px; }
  .exp-cat.materials { background:#e8f3fd; color:#1a6fc4; }
  .exp-cat.subcontractor { background:#fdf3e3; color:#b07d10; }
  .exp-cat.deposit { background:#e8f8ee; color:#1f8a4c; }
  .exp-cat.other { background:#f2eefd; color:#6d4aff; }
  .receipt-thumb { width:44px; height:44px; object-fit:cover; border-radius:6px; border:1px solid var(--border); cursor:pointer; background:#fafafe; }
  .receipt-icon { width:44px; height:44px; display:flex; align-items:center; justify-content:center; border-radius:6px; border:1px solid var(--border); cursor:pointer; background:#fafafe; font-size:18px; color:var(--muted); }
  .exp-total-pos { color:var(--text); font-weight:600; }
  .exp-total-neg { color:var(--good); font-weight:600; }
  .week-header-row { display:flex; justify-content:space-between; align-items:center; padding:10px 12px; background:#fafafe; border-bottom:2px solid var(--border); font-weight:600; flex-wrap:wrap; gap:6px; }
  #receipt-modal { position:fixed; inset:0; background:rgba(20,20,35,.85); display:flex; align-items:center; justify-content:center; z-index:200; padding:20px; }
  #receipt-modal img, #receipt-modal iframe { max-width:92vw; max-height:85vh; border-radius:8px; background:#fff; }
  #receipt-modal .modal-close { position:absolute; top:16px; right:20px; color:#fff; font-size:28px; cursor:pointer; background:none; border:none; }
  .file-pick { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .file-pick input[type=file] { display:none; }
  .staged-strip { display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; }
  .staged-photo { position:relative; width:64px; height:64px; }
  .staged-photo img { width:64px; height:64px; object-fit:cover; border-radius:8px; border:2px solid var(--p); display:block; }
  .staged-doc { position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center; width:64px; height:64px; border:2px solid var(--p); border-radius:8px; font-size:10px; background:#f0edff; color:var(--p); text-align:center; padding:2px; overflow:hidden; }
  .staged-remove { position:absolute; top:-7px; right:-7px; width:20px; height:20px; border-radius:50%; background:var(--danger); color:#fff; border:none; font-size:11px; line-height:1; cursor:pointer; font-weight:700; }
  .badge { display:inline-block; background:var(--p); color:#fff; border-radius:10px; font-size:10px; padding:1px 6px; margin-left:6px; vertical-align:top; }
  .draft-restored { font-size:12px; color:var(--p); background:#f0edff; border-radius:6px; padding:6px 10px; margin-bottom:10px; }

  @media (max-width:600px){
    .hide-sm { display:none; }
    table.wgrid { min-width:540px; font-size:12px; }
    .cell-input { min-width:42px; padding:8px 2px; }
    table.wgrid th.rowhead { min-width:120px; }
  }
</style>
</head>
<body>

<div id="login-screen">
  <h1>Freelance Billing</h1>
  <p>Sign in to your workspace</p>
  <div id="login-error"></div>
  <input type="email" id="login-email" placeholder="Email">
  <input type="password" id="login-password" placeholder="Password">
  <button class="btn" style="width:100%" onclick="handleLogin()">Sign In</button>
</div>

<div id="app" class="hidden">
  <header>
    <h1>Freelance Billing</h1>
    <button id="logout-btn" onclick="handleLogout()">Log out</button>
  </header>
  <nav>
    <button data-view="time" class="active">Time</button>
    <button data-view="clients">Clients</button>
    <button data-view="expenses">Expenses</button>
    <button data-view="estimates">Estimates</button>
    <button data-view="invoices">Invoices</button>
  </nav>
  <main>
    <div id="view-time"></div>
    <div id="view-clients" class="hidden"></div>
    <div id="view-expenses"></div>
    <div id="view-estimates" class="hidden"><div class="empty">Estimates — coming after expenses.</div></div>
    <div id="view-invoices" class="hidden"><div class="empty">Invoicing &amp; receipts PDF — final step.</div></div>
  </main>
</div>

<div class="toast" id="toast"></div>

<script>
// ==================================================================
// CONFIG — paste YOUR values from Supabase Dashboard → Settings → API
// ==================================================================
const SUPABASE_URL = 'https://oexgfphcwztifchjsehr.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_25kmLQ0NXu1Ks3XkhSXKsA_ITOd8beJ';

const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let timeTab = 'week';
let weekStart = mondayOf(new Date());
let pendingSaves = new Map();
let expTab = 'week';
let expFilterProject = '';

const EXP_CATEGORIES = ['Materials', 'Subcontractor', 'Deposit', 'Other'];
const DRAFT_KEY = 'expenseDraft';

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2400);
}
function mondayOf(d) {
  const x = new Date(d); x.setHours(0,0,0,0);
  x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x;
}
function isoDate(d) { return d.toISOString().slice(0,10); }
function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }
function fmtDate(d) { return d ? new Date(d + 'T00:00').toLocaleDateString(undefined,{month:'short',day:'numeric'}) : ''; }
function fmtDateFull(d) { return d ? new Date(d + 'T00:00').toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric',year:'numeric'}) : ''; }
function fmtMoney(n) { return '$' + Number(n || 0).toFixed(2); }
function fmtHours(min) { const h = min / 60; return Number.isInteger(h) ? h + ':00' : h.toFixed(2); }
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function catClass(c) { return String(c||'other').toLowerCase().replace(/[^a-z]/g,''); }
function isImageFile(name) { return /\.(jpe?g|png|gif|webp|heic)$/i.test(name); }

async function handleLogin() {
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;
  const err = document.getElementById('login-error');
  const { error } = await db.auth.signInWithPassword({ email, password });
  if (error) { err.textContent = error.message; return; }
}
async function handleLogout() { await db.auth.signOut(); }
db.auth.onAuthStateChange((event) => {
  const logged = event === 'SIGNED_IN';
  document.getElementById('login-screen').classList.toggle('hidden', logged);
  document.getElementById('app').classList.toggle('hidden', !logged);
  if (logged) { loadAll(); }
});

document.querySelectorAll('nav button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    ['time','clients','expenses','estimates','invoices'].forEach(v => {
      document.getElementById('view-' + v).classList.toggle('hidden', v !== btn.dataset.view);
    });
    if (btn.dataset.view === 'expenses') renderExpenses();
  });
});

// ---------------- data cache ----------------
let clients = [], projects = [], tasks = [], timeEntries = [], expenses = [], receiptFiles = [];
async function loadAll() {
  [clients, projects, tasks, timeEntries, expenses, receiptFiles] =
    await Promise.all([fetchClients(), fetchProjects(), fetchTasks(), fetchTime(), fetchExpenses(), fetchReceipts()]);
  renderTime(); renderClients(); renderExpenses();
}
async function fetchClients() {
  const { data, error } = await db.from('clients').select('*').order('name');
  if (error) { toast('clients: ' + error.message); return []; }
  return data || [];
}
async function fetchProjects() {
  const { data, error } = await db.from('projects').select('*').order('name');
  if (error) { toast('projects: ' + error.message); return []; }
  return data || [];
}
async function fetchTasks() {
  const { data, error } = await db.from('tasks').select('*').order('name');
  if (error) { toast('tasks: ' + error.message); return []; }
  return data || [];
}
async function fetchTime() {
  const { data, error } = await db.from('time_entries').select('*').order('entry_date', { ascending: false }).limit(500);
  if (error) { toast('time: ' + error.message); return []; }
  return data || [];
}
async function fetchExpenses() {
  const { data, error } = await db.from('expenses').select('*').order('expense_date', { ascending: false }).limit(500);
  if (error) { toast('expenses: ' + error.message); return []; }
  return data || [];
}
async function fetchReceipts() {
  const { data, error } = await db.from('receipt_files').select('*');
  if (error) { toast('receipts: ' + error.message); return []; }
  return data || [];
}
function taskById(id) { return tasks.find(t => t.id === id) || null; }
function projectById(id) { return projects.find(p => p.id === id) || null; }
function clientById(id) { return clients.find(c => c.id === id) || null; }
function receiptsFor(expenseId) { return receiptFiles.filter(r => r.expense_id === expenseId); }
function projectClientName(pid) {
  const p = projectById(pid);
  if (!p) return { proj: '—', cli: '—' };
  const c = clientById(p.client_id);
  return { proj: p.name, cli: c ? c.name : '—' };
}

function effectiveRate(entry) {
  const task = entry.task_id ? taskById(entry.task_id) : null;
  if (task && task.hourly_rate != null) return Number(task.hourly_rate);
  const proj = entry.project_id ? projectById(entry.project_id) : null;
  if (proj && proj.billing_rate != null) return Number(proj.billing_rate);
  if (proj) { const c = clientById(proj.client_id); if (c && c.billing_rate != null) return Number(c.billing_rate); }
  return null;
}
function taskLabel(task) {
  const proj = projectById(task.project_id);
  const cli = proj ? clientById(proj.client_id) : null;
  return { client: cli ? cli.name : '—', project: proj ? proj.name : '—', task: task.name };
}

// ==================================================================
// TIME VIEW
// ==================================================================
function renderTime() {
  const el = document.getElementById('view-time');
  el.innerHTML = `
    <div class="view-title">Time Entries
      <span style="font-size:14px;color:var(--muted)">week: ${weekHours()}h${weekValue()?': '+fmtMoney(weekValue()):''}</span>
    </div>
    <div class="tab-switch">
      <button class="${timeTab==='week'?'active':''}" onclick="setTimeTab('week')">Weekly Grid</button>
      <button class="${timeTab==='list'?'active':''}" onclick="setTimeTab('list')">Entry List</button>
    </div>
    <div id="time-body"></div>`;
  if (timeTab === 'week') renderWeekGrid(); else renderTimeList();
}
function setTimeTab(t) { timeTab = t; renderTime(); }

async function renderWeekGrid() {
  const body = document.getElementById('time-body');
  const days = [...Array(7)].map((_, i) => addDays(weekStart, i));
  const wStart = isoDate(weekStart), wEnd = isoDate(addDays(weekStart, 6));

  timeEntries = await fetchTime();
  const weekEntries = timeEntries.filter(e => e.entry_date >= wStart && e.entry_date <= wEnd);

  const usedTaskIds = new Set(weekEntries.map(e => e.task_id).filter(Boolean));
  const gridTasks = tasks.filter(t => {
    const proj = projectById(t.project_id);
    const projActive = proj ? proj.active : false;
    return (t.active && projActive) || usedTaskIds.has(t.id);
  });

  gridTasks.sort((a,b) => {
    const la = taskLabel(a), lb = taskLabel(b);
    return (la.client+la.project+la.task).localeCompare(lb.client+lb.project+lb.task);
  });

  const todayIso = isoDate(new Date());
  const dayNames = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];

  let head = `<tr><th class="rowhead">Client / Project / Task</th>`;
  days.forEach((d,i) => {
    const isToday = isoDate(d) === todayIso;
    head += `<th class="${isToday?'today-col':''}">${dayNames[i]}<br><span style="font-weight:400">${fmtDate(isoDate(d))}</span></th>`;
  });
  head += `<th class="total">Total</th></tr>`;

  let rows = '';
  if (!gridTasks.length) {
    rows = `<tr><td colspan="9" class="empty">Nothing on this week's sheet. Add tasks under Clients, or activate tasks you closed.</td></tr>`;
  }
  gridTasks.forEach(t => {
    const lbl = taskLabel(t);
    const proj = projectById(t.project_id);
    const isActive = t.active && proj && proj.active;
    let cells = '', rowTotal = 0;

    days.forEach((d,i) => {
      const iso = isoDate(d);
      const matches = weekEntries.filter(e => e.task_id === t.id && e.entry_date === iso);
      const mins = matches.reduce((s,e) => s + e.minutes, 0);
      rowTotal += mins;
      const hrs = mins ? (mins/60) : '';
      const isToday = iso === todayIso;

      cells += `<td class="${isToday?'today-col':''}">
        <input class="cell-input ${hrs?'filled':''}" type="number" step="0.25" min="0" inputmode="decimal"
          value="${hrs}" placeholder="·"
          data-task="${t.id}" data-date="${iso}"
          onfocus="cellFocus(this)" onblur="cellBlur(this)">
      </td>`;
    });

    rows += `<tr${isActive?'':' style="opacity:.55"'}>
      <td class="rowhead">
        <div style="font-weight:600">${esc(lbl.client)}</div>
        <div style="color:var(--muted);font-size:12px">${esc(lbl.project)}</div>
        <div style="color:var(--muted);font-size:11px">${esc(lbl.task)}</div>
        <div style="margin-top:4px">
          ${isActive
            ? `<button class="close-btn" onclick="closeTask('${t.id}')">✕ close</button>`
            : `<button class="close-btn" onclick="reopenTask('${t.id}')">↺ reopen</button>`}
        </div>
      </td>
      ${cells}
      <td class="total">${rowTotal ? fmtHours(rowTotal) : '—'}</td>
    </tr>`;
  });

  let footCells = '';
  let grand = 0;
  days.forEach(d => {
    const iso = isoDate(d);
    const mins = weekEntries.filter(e => e.entry_date === iso).reduce((s,e) => s + e.minutes, 0);
    grand += mins;
    footCells += `<td class="total">${mins ? fmtHours(mins) : '—'}</td>`;
  });

  body.innerHTML = `
    <div class="card">
      <div class="week-nav">
        <div style="display:flex;gap:8px;align-items:center">
          <button class="btn secondary small" onclick="shiftWeek(-1)">← Prev</button>
          <button class="btn secondary small" onclick="shiftWeek(0)">This Week</button>
          <button class="btn secondary small" onclick="shiftWeek(1)">Next →</button>
        </div>
        <div class="week-label">${fmtDate(wStart)} – ${fmtDate(wEnd)}</div>
      </div>
      <div class="grid-wrap">
        <table class="wgrid">
          <thead>${head}</thead>
          <tbody>${rows}</tbody>
          <tfoot><tr><td class="rowhead" style="font-weight:600;font-size:11px">Daily Total</td>${footCells}<td class="total">${grand?fmtHours(grand):'—'}</td></tr></tfoot>
        </table>
      </div>
      <div style="font-size:12px;color:var(--muted);margin-top:10px">Hours save automatically when you leave a cell. ✕ close removes a task from current/future sheets; rows with hours this week stay visible (grayed) until the week rolls over.</div>
    </div>
    <div class="card">
      <div style="font-weight:600;margin-bottom:8px">Quick Add (different date / notes)</div>
      <div class="form-row">
        <div><label>Date</label><input type="date" id="t-date" value="${todayIso}"></div>
        <div><label>Hours</label><input type="number" id="t-hours" min="0.25" step="0.25" placeholder="1.5" inputmode="decimal"></div>
        <div style="flex:3"><label>Task</label><select id="t-task"><option value="">Select task…</option>${taskOptions()}</select></div>
      </div>
      <div class="form-row"><div style="flex:3"><label>Notes</label><input type="text" id="t-notes" placeholder="What did you work on?"></div>
        <div style="align-self:flex-end"><button class="btn" onclick="addTime()">Add Entry</button></div>
      </div>
    </div>`;
}

function shiftWeek(dir) {
  if (dir === 0) weekStart = mondayOf(new Date());
  else weekStart = addDays(weekStart, dir * 7);
  renderWeekGrid();
}

async function closeTask(taskId) {
  const { error } = await db.from('tasks').update({ active: false }).eq('id', taskId);
  if (error) { toast(error.message); return; }
  tasks = await fetchTasks();
  renderWeekGrid();
  toast('Closed — stays on this week only if it has hours');
}
async function reopenTask(taskId) {
  const { error } = await db.from('tasks').update({ active: true }).eq('id', taskId);
  if (error) { toast(error.message); return; }
  tasks = await fetchTasks();
  renderWeekGrid();
  toast('Task reopened');
}

function cellFocus(input) { input.dataset.originalValue = input.value; }
function cellBlur(input) {
  if (input.dataset.originalValue === input.value.trim()) return;
  saveCellInternal(input);
}
async function saveCellInternal(input) {
  const key = input.dataset.task + '|' + input.dataset.date;
  if (pendingSaves.has(key)) return;
  pendingSaves.set(key, true);
  try {
    const taskId = input.dataset.task, date = input.dataset.date;
    const raw = input.value.trim();
    const hours = raw === '' ? 0 : parseFloat(raw);
    if (isNaN(hours) || hours < 0) {
      toast('Invalid hours');
      input.value = input.dataset.originalValue || '';
      return;
    }
    const minutes = Math.round(hours * 60);
    const existing = timeEntries.filter(e => e.task_id === taskId && e.entry_date === date);

    if (minutes === 0) {
      for (const e of existing) await db.from('time_entries').delete().eq('id', e.id);
    } else if (existing.length >= 1) {
      const { error } = await db.from('time_entries').update({ minutes }).eq('id', existing[0].id);
      if (error) { toast(error.message); return; }
      for (const e of existing.slice(1)) await db.from('time_entries').delete().eq('id', e.id);
    } else {
      const task = taskById(taskId);
      const { error } = await db.from('time_entries').insert({
        entry_date: date, minutes, project_id: task ? task.project_id : null, task_id: taskId, notes: ''
      });
      if (error) { toast(error.message); return; }
    }
    timeEntries = await fetchTime();
    renderWeekGrid();
  } finally {
    pendingSaves.delete(key);
  }
}

function taskOptions() {

}
function renderTimeList() {

function weekHours() {
  const wStart = isoDate(weekStart), wEnd = isoDate(addDays(weekStart,6));
  return (timeEntries.filter(e => e.entry_date>=wStart && e.entry_date<=wEnd).reduce((s,e)=>s+e.minutes,0)/60).toFixed(1);
}
function weekValue() {
  const wStart = isoDate(weekStart), wEnd = isoDate(addDays(weekStart,6));
  return timeEntries.filter(e => e.entry_date>=wStart && e.entry_date<=wEnd)
    .reduce((s,e)=>{const r=effectiveRate(e);return s+(r!=null?(e.minutes/60)*r:0);},0);
}
async function addTime() {
  const date = document.getElementById('t-date').value;
  const hours = parseFloat(document.getElementById('t-hours').value);
  const taskSel = document.getElementById('t-task').value;
  const notes = document.getElementById('t-notes').value.trim();

  if (!taskSel) { toast('Select a task'); return; }
  const task = taskById(taskSel);
  if (!task) { toast('Task not found'); return; }
  const { error } = await db.from('time_entries').insert({
    entry_date: date, minutes: Math.round(hours*60), project_id: task.project_id, task_id: task.id, notes
  });
  if (error) { toast(error.message); return; }
  timeEntries = await fetchTime();
  weekStart = mondayOf(new Date(date + 'T00:00'));
  renderTime(); toast('Time entry saved');
}
async function deleteTime(id) {
  if (!confirm('Delete this time entry?')) return;
  const { error } = await db.from('time_entries').delete().eq('id', id);
  if (error) { toast(error.message); return; }
  timeEntries = timeEntries.filter(t => t.id !== id); renderTime();
}

// ---- new/edit expense form (with draft preservation) ----
let editingExpenseId = null;
let stagedFiles = [];   // [{file, name, previewUrl}]
let draftNoticeShown = false;

function saveDraft() {
  const g = id => document.getElementById(id);
  if (!g('e-date')) return;
  const draft = {
    date: g('e-date').value,
    project: g('e-project').value,
    vendor: g('e-vendor').value,
    amount: g('e-amount').value,
    category: g('e-category').value,
    notes: g('e-notes').value,
    editingId: editingExpenseId,
    savedAt: Date.now()
  };
  try { localStorage.setItem(DRAFT_KEY, JSON.stringify(draft)); } catch(err) {}
}
function clearDraft() {
  try { localStorage.removeItem(DRAFT_KEY); } catch(err) {}
  draftNoticeShown = false;
}
function readDraft() {
  try { return JSON.parse(localStorage.getItem(DRAFT_KEY)); } catch(err) { return null; }
}
function restoreDraft() {
  const d = readDraft();
  if (!d || !d.savedAt) return;
  // discard drafts older than 7 days
  if (Date.now() - d.savedAt > 7*24*3600*1000) { clearDraft(); return; }
  const g = id => document.getElementById(id);
  if (!g('e-date')) return;
  // if it was an edit for an expense that no longer exists, discard
  if (d.editingId && !expenses.find(x => x.id === d.editingId)) { clearDraft(); return; }

  const empty = !d.vendor && !d.amount && !d.project && !d.notes && !d.editingId;
  if (empty) return;

  if (d.editingId) {
    editingExpenseId = d.editingId;
    document.getElementById('exp-form-title').textContent = 'Edit Expense';
    document.getElementById('e-cancel').classList.remove('hidden');
  }
  if (d.date) g('e-date').value = d.date;
  if (d.project) g('e-project').value = d.project;
  if (d.vendor) g('e-vendor').value = d.vendor;
  if (d.amount !== '' && d.amount != null) g('e-amount').value = d.amount;
  if (d.category && EXP_CATEGORIES.includes(d.category)) g('e-category').value = d.category;
  if (d.notes) g('e-notes').value = d.notes;

  if (!draftNoticeShown) {
    draftNoticeShown = true;
    const form = document.getElementById('exp-form');
    const notice = document.createElement('div');
    notice.className = 'draft-restored';
    notice.textContent = '↩︎ Restored your unsaved expense draft. If the camera reloaded the page, retake the receipt photo, then tap Save Expense.';
    form.insertBefore(notice, form.children[1]);
  }
}

      </select></div>

      <div style="flex:3"><label>Notes (use for "Other" details)</label><input type="text" id="e-notes" placeholder="Optional"></div>

      <div style="flex:3"><label>Receipt</label>

        </div>
        <div class="staged-strip" id="e-staged"></div>

function refreshStagedFiles() {
  const strip = document.getElementById('e-staged');
  const count = document.getElementById('e-count');
  if (!strip) return;
  strip.innerHTML = stagedFiles.map((sf, i) => {
    if (sf.previewUrl && isImageFile(sf.name)) {
      return `<div class="staged-photo"><img src="${sf.previewUrl}" alt="staged"><button class="staged-remove" onclick="removeStaged(${i})">✕</button></div>`;
    }
    return `<div class="staged-doc"><span>${esc(sf.name.length > 18 ? sf.name.slice(0,16)+'…' : sf.name)}</span><button class="staged-remove" onclick="removeStaged(${i})">✕</button></div>`;
  }).join('');
  if (count) {
    if (stagedFiles.length) { count.style.display='inline-block'; count.textContent = stagedFiles.length; }
    else { count.style.display='none'; }
  }
}
function removeStaged(i) {
  const sf = stagedFiles.splice(i,1)[0];
  if (sf && sf.previewUrl) URL.revokeObjectURL(sf.previewUrl);
  refreshStagedFiles();
}
function isDuplicateStaged(f) {
  return stagedFiles.some(sf =>
    sf.file.name === f.name &&
    sf.file.size === f.size &&
    sf.file.lastModified === f.lastModified);
}
function cancelExpenseEdit() {
  editingExpenseId = null;
  stagedFiles.forEach(sf => { if (sf.previewUrl) URL.revokeObjectURL(sf.previewUrl); });
  stagedFiles = [];
  const f = document.getElementById('e-file'); if (f) f.value = '';
  document.getElementById('exp-form-title').textContent = 'Add Expense';
  document.getElementById('e-cancel').classList.add('hidden');
  resetExpenseForm();
  clearDraft();
}
function resetExpenseForm() {
  ['e-vendor','e-amount','e-notes'].forEach(i => { const el = document.getElementById(i); if (el) el.value=''; });
  const d = document.getElementById('e-date'); if (d) d.value = isoDate(new Date());
  const c = document.getElementById('e-category'); if (c) c.selectedIndex = 0;
  const p = document.getElementById('e-project'); if (p) p.selectedIndex = 0;
  refreshStagedFiles();
}

function wireExpenseForm() {
  const form = document.getElementById('exp-form');
  const input = document.getElementById('e-file');
  if (!form || !input) return;

  // draft-save on every keystroke / selection
  form.addEventListener('input', saveDraft);
  form.addEventListener('change', saveDraft);

  input.addEventListener('change', () => {
    let added = 0, skipped = 0;
    for (const f of input.files) {
      if (isDuplicateStaged(f)) { skipped++; continue; }
      stagedFiles.push({
        file: f, name: f.name,
        previewUrl: (isImageFile(f.name) && f.size < 15000000) ? URL.createObjectURL(f) : null
      });
      added++;
    }
    input.value = '';
    refreshStagedFiles();
    if (added && skipped) toast(`${added} receipt${added>1?'s':''} attached (${skipped} duplicate${skipped>1?'s':''} skipped)`);
    else if (added) toast('Receipt attached — tap Save Expense when ready');
    else if (skipped) toast('Duplicate photo skipped');
  });
  refreshStagedFiles();
  restoreDraft();
}

// safety net: persist the draft the instant the page is hidden
// (Android does this when handing control to the camera app)
document.addEventListener('visibilitychange', () => { if (document.hidden) saveDraft(); });
window.addEventListener('pagehide', saveDraft);

async function saveExpense() {
  const date = document.getElementById('e-date').value;
  const projectId = document.getElementById('e-project').value;
  const vendor = document.getElementById('e-vendor').value.trim();
  const amount = parseFloat(document.getElementById('e-amount').value);
  const category = document.getElementById('e-category').value;
  const notes = document.getElementById('e-notes').value.trim();

  if (!date) { toast('Date required'); return; }
  if (!projectId) { toast('Select a project'); return; }
  if (!vendor) { toast('Vendor required'); return; }
  if (isNaN(amount)) { toast('Amount required (use negative for deposits)'); return; }

  const btn = event ? event.target : null;
  if (btn) { btn.disabled = true; btn.textContent = 'Saving…'; }

  const proj = projectById(projectId);
  const payload = {
    project_id: projectId,
    client_id: proj ? proj.client_id : null,
    expense_date: date,
    vendor, amount, category, notes,
    updated_at: new Date().toISOString(),
  };

  let expId = editingExpenseId;
  if (editingExpenseId) {
    const { error } = await db.from('expenses').update(payload).eq('id', editingExpenseId);
    if (error) { toast(error.message); if (btn) { btn.disabled=false; btn.textContent='Save Expense'; } return; }
  } else {
    const { data, error } = await db.from('expenses').insert(payload).select('id').single();
    if (error) { toast(error.message); if (btn) { btn.disabled=false; btn.textContent='Save Expense'; } return; }
    expId = data.id;
  }

  for (const sf of stagedFiles) {
    const path = expId + '/' + Date.now() + '-' + sf.name.replace(/[^a-zA-Z0-9._-]/g,'_');
    const { error } = await db.storage.from('receipts').upload(path, sf.file, { upsert: true });
    if (error) { toast('Receipt upload failed: ' + error.message); continue; }
    const { error: e2 } = await db.from('receipt_files').insert({ expense_id: expId, storage_path: path, filename: sf.name });
    if (e2) { toast(e2.message); }
  }

  expenses = await fetchExpenses();
  receiptFiles = await fetchReceipts();
  cancelExpenseEdit();
  renderExpenses();
  toast('Expense saved');
}

function editExpense(id) {
  const e = expenses.find(x => x.id === id); if (!e) return;
  editingExpenseId = id; stagedFiles = [];
  document.getElementById('exp-form-title').textContent = 'Edit Expense';
  document.getElementById('e-cancel').classList.remove('hidden');
  document.getElementById('e-date').value = e.expense_date;
  document.getElementById('e-project').value = e.project_id || '';
  document.getElementById('e-vendor').value = e.vendor || '';
  document.getElementById('e-amount').value = e.amount;
  document.getElementById('e-category').value = EXP_CATEGORIES.includes(e.category) ? e.category : 'Other';
  document.getElementById('e-notes').value = e.notes || '';
  saveDraft();
  refreshStagedFiles();
  window.scrollTo({top:0,behavior:'smooth'});
}

async function deleteExpense(id) {
  const recs = receiptsFor(id);
  const msg = recs.length
    ? `Delete this expense and its ${recs.length} receipt file(s)?`
    : 'Delete this expense?';
  if (!confirm(msg)) return;
  for (const r of recs) {
    await db.storage.from('receipts').remove([r.storage_path]);
  }
  const { error } = await db.from('expenses').delete().eq('id', id);
  if (error) { toast(error.message); return; }
  expenses = await fetchExpenses();
  receiptFiles = await fetchReceipts();
  renderExpenses();
  toast('Expense deleted');
}

function expenseReceiptHtml(e) {
  const recs = receiptsFor(e.id);
  if (!recs.length) return '<span style="color:var(--muted)">—</span>';
  return recs.map((r, i) => {
    if (isImageFile(r.filename) || isImageFile(r.storage_path)) {
      return `<img class="receipt-thumb" src="receipt-thumb:${r.id}" onclick="openReceipt('${r.id}')" alt="receipt">`;
    }
    return `<div class="receipt-icon" onclick="openReceipt('${r.id}')" title="${esc(r.filename)}">📄</div>`;
  }).join('');
}

async function openReceipt(receiptId) {
  const r = receiptFiles.find(x => x.id === receiptId);
  if (!r) return;
  const { data } = await db.storage.from('receipts').createSignedUrl(r.storage_path, 3600);
  if (!data || !data.signedUrl) { toast('Could not load receipt'); return; }
  const isImg = isImageFile(r.filename) || isImageFile(r.storage_path);
  const modal = document.createElement('div');
  modal.id = 'receipt-modal';
  modal.innerHTML = `<button class="modal-close" onclick="this.parentElement.remove()">×</button>
    ${isImg ? `<img src="${data.signedUrl}" alt="receipt">`
            : `<iframe src="${data.signedUrl}" style="width:88vw;height:80vh"></iframe>`}`;
  modal.addEventListener('click', (ev) => { if (ev.target === modal) modal.remove(); });
  document.body.appendChild(modal);
}

function renderExpWeekly() {
  const body = document.getElementById('exp-body');
  body.innerHTML = renderExpenseForm();
  wireExpenseForm();

  const byWeek = {};
  expenses.forEach(e => { (byWeek[e.expense_date] = byWeek[e.expense_date] || []).push(e); });
  const weeks = {};
  Object.keys(byWeek).forEach(d => {
    const mon = isoDate(mondayOf(new Date(d + 'T00:00')));
    (weeks[mon] = weeks[mon] || []).push(...byWeek[d]);
  });
  const weekKeys = Object.keys(weeks).sort().reverse();

  if (!weekKeys.length) {
    body.insertAdjacentHTML('beforeend', '<div class="empty">No expenses yet — add your first one above.</div>');
    return;
  }

  weekKeys.forEach(wk => {
    const list = weeks[wk].sort((a,b) => (a.expense_date < b.expense_date ? 1 : -1));
    const total = sumExpenses(list);
    const negTotal = list.filter(e => Number(e.amount) < 0).reduce((s,e) => s + Number(e.amount), 0);
    const rows = list.map(e => {
      const pc = projectClientName(e.project_id);
      return `<tr>
        <td style="white-space:nowrap">${fmtDate(e.expense_date)}</td>
        <td><div>${esc(pc.proj)}</div><div style="font-size:11px;color:var(--muted)">${esc(pc.cli)}</div></td>
        <td>
          <div>${esc(e.vendor)}</div>
          ${e.notes ? `<div style="font-size:11px;color:var(--muted)">${esc(e.notes)}</div>` : ''}
        </td>
        <td class="hide-sm"><span class="exp-cat ${catClass(e.category)}">${esc(e.category||'Other')}</span></td>
        <td style="text-align:right;white-space:nowrap" class="${Number(e.amount)<0?'exp-total-neg':'exp-total-pos'}">${fmtMoney(e.amount)}</td>
        <td style="text-align:center">${expenseReceiptHtml(e)}</td>
        <td style="text-align:right"><span class="row-actions">
          <button class="btn tiny secondary" onclick="editExpense('${e.id}')">Edit</button>
          <button class="btn tiny secondary" onclick="deleteExpense('${e.id}')">✕</button>
        </span></td>
      </tr>`;
    }).join('');
    body.insertAdjacentHTML('beforeend', `
      <div class="card" style="padding:0">
        <table>
          <thead><tr>
            <th class="week-header-row" colspan="7" style="border-bottom:2px solid var(--border);padding:0">
              <span style="padding:10px 12px">Week of ${fmtDate(wk)}</span>
              <span style="padding:10px 12px">${fmtMoney(total)}${negTotal ? ` <small style="color:var(--good);font-weight:400">(incl. deposits ${fmtMoney(negTotal)})</small>` : ''}</span>
            </th>
          </tr>
          <tr><th>Date</th><th>Project</th><th>Vendor</th><th class="hide-sm">Category</th><th style="text-align:right">Amount</th><th style="text-align:center">Receipt</th><th></th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>`);
  });

  hydrateThumbs();
}

async function hydrateThumbs() {
  const imgs = document.querySelectorAll('img[src^="receipt-thumb:"]');
  for (const img of imgs) {
    const rid = img.getAttribute('src').split(':')[1];
    const r = receiptFiles.find(x => x.id === rid);
    if (!r) continue;
    const { data } = await db.storage.from('receipts').createSignedUrl(r.storage_path, 3600);
    if (data && data.signedUrl) img.src = data.signedUrl;
  }
}

    <div class="card">
      <label>Filter by project</label>
      <select onchange="expFilterProject=this.value;renderExpenses()">
        <option value="">All projects…</option>${sel}
      </select>
    </div>`;

  let list = expenses;
  if (expFilterProject) list = list.filter(e => e.project_id === expFilterProject);
  if (!list.length) {
    body.insertAdjacentHTML('beforeend', `<div class="empty">No expenses found${expFilterProject?" for this project":""}.</div>`);
  }

  const groups = {};
  list.forEach(e => { (groups[e.project_id] = groups[e.project_id] || []).push(e); });
  Object.keys(groups).sort((a,b) => {
    const pa = projectClientName(a), pb = projectClientName(b);
    return (pa.cli + pa.proj).localeCompare(pb.cli + pb.proj);
  }).forEach(pid => {
    const pc = projectClientName(pid);
    const plist = groups[pid].sort((a,b) => (a.expense_date < b.expense_date ? 1 : -1));

      <td class="hide-sm"><span class="exp-cat ${catClass(e.category)}">${esc(e.category||'Other')}</span></td>
      <td style="text-align:right;white-space:nowrap" class="${Number(e.amount)<0?'exp-total-neg':'exp-total-pos'}">${fmtMoney(e.amount)}</td>
      <td style="text-align:center">${expenseReceiptHtml(e)}</td>
      <td style="text-align:right"><span class="row-actions">
        <button class="btn tiny secondary" onclick="editExpenseSwitchTab('${e.id}')">Edit</button>
        <button class="btn tiny secondary" onclick="deleteExpense('${e.id}')">✕</button>
      </span></td>
    </tr>`).join('');
    body.insertAdjacentHTML('beforeend', `
      <div class="card" style="padding:0">
        <table>
          <thead><tr>
            <th colspan="6" class="week-header-row" style="padding:0">
              <span style="padding:10px 12px">${esc(pc.cli)} — ${esc(pc.proj)}</span>
              <span style="padding:10px 12px">${fmtMoney(total)}</span>

          <tbody>${rows}</tbody>
        </table>
      </div>`);
  });
  hydrateThumbs();
}

}

let editingClientId = null;
function fillClientForm(id) {
  const c = clients.find(x => x.id === id); if (!c) return;
  editingClientId = id;
  document.getElementById('c-name').value = c.name||'';
  document.getElementById('c-email').value = c.email||'';
  document.getElementById('c-rate').value = c.billing_rate||'';
  document.getElementById('c-address').value = c.address||'';
  document.getElementById('c-cancel').classList.remove('hidden');
  window.scrollTo({top:0,behavior:'smooth'});
}
function clearClientForm() {
  editingClientId = null;
  ['c-name','c-email','c-rate','c-address'].forEach(i => document.getElementById(i).value='');
  document.getElementById('c-cancel').classList.add('hidden');
}
async function saveClient() {
  const name = document.getElementById('c-name').value.trim();
  if (!name) { toast('Name required'); return; }
  const payload = {
    name,
    email: document.getElementById('c-email').value.trim()||null,
    billing_rate: parseFloat(document.getElementById('c-rate').value)||null,
    address: document.getElementById('c-address').value.trim()||null,
    updated_at: new Date().toISOString(),
  };
  const { error } = editingClientId
    ? await db.from('clients').update(payload).eq('id', editingClientId)
    : await db.from('clients').insert(payload);
  if (error) { toast(error.message); return; }
  clearClientForm(); clients = await fetchClients();
  renderClients(); renderTime(); renderExpenses(); toast('Client saved');
}
async function deleteClient(id) {
  if (!confirm('Delete this client AND all their projects, tasks, expenses and time entries?')) return;
  const { error } = await db.from('clients').delete().eq('id', id);
  if (error) { toast(error.message); return; }
  await loadAll(); toast('Client deleted');
}
async function addProject(clientId) {
  const name = document.getElementById('np-'+clientId).value.trim();
  const rate = parseFloat(document.getElementById('npr-'+clientId).value);
  if (!name) { toast('Project name required'); return; }
  const { error } = await db.from('projects').insert({ client_id: clientId, name, billing_rate: rate||null });
  if (error) { toast(error.message); return; }
  projects = await fetchProjects(); renderClients(); renderTime(); renderExpenses(); toast('Project added');
}
async function toggleProject(id, active) {
  const { error } = await db.from('projects').update({ active }).eq('id', id);
  if (error) { toast(error.message); return; }
  projects = await fetchProjects(); renderClients(); renderTime(); renderExpenses();
}
async function deleteProject(id) {

  const { error } = await db.from('projects').delete().eq('id', id);

}
async function addTask(projectId) {

async function toggleTask(id, active) {

async function deleteTask(id) {

  const { error } = await db.from('tasks').delete().eq('id', id);

}

// ---------- constants & state ----------
const EST_BUSINESS_NAME = '4th Generation';
const EST_DEFAULT_TYPES = ['Labor', 'Materials', 'Subcontractor', 'Permits', 'Disposal', 'Overhead & Profit'];
const EST_STATUSES = ['draft', 'sent', 'accepted', 'declined', 'expired'];

let EST_TYPES = [...EST_DEFAULT_TYPES];
let estimates = [];        // cached estimate headers
let estimateItems = [];    // cached line items (all estimates)
let estMode = 'list';      // 'list' | 'edit'
let editingEstimateId = null;
let estLines = [];         // editor working copy of line items

// ---------- fetch / tab hook ----------
async function fetchEstimates() {
  const { data, error } = await db.from('estimates').select('*').order('estimate_number', { ascending: false }).limit(500);
  if (error) { toast('estimates: ' + error.message); return []; }
  return data || [];
}
async function fetchEstimateItems() {
  const { data, error } = await db.from('estimate_items').select('*');
  if (error) { toast('estimate_items: ' + error.message); return []; }
  return data || [];
}
function estItemsFor(estId) { return estimateItems.filter(i => i.estimate_id === estId).sort((a,b) => (a.position||0)-(b.position||0)); }
function rebuildEstTypes() {
  EST_TYPES = [...EST_DEFAULT_TYPES];
  estimateItems.forEach(it => { if (it.item_type && !EST_TYPES.includes(it.item_type)) EST_TYPES.push(it.item_type); });
}
async function estRefreshData() {
  estimates = await fetchEstimates();
  estimateItems = await fetchEstimateItems();
  rebuildEstTypes();
}
async function estLoadAndRender() {
  await estRefreshData();
  renderEstimates();
}
// own listener on the Estimates tab — coexists with the existing nav handler
document.querySelectorAll('nav button[data-view="estimates"]').forEach(btn => {
  btn.addEventListener('click', estLoadAndRender);
});

// ---------- numbering: sequential, zero-padded ----------
function padEstNumber(n) { return String(n).padStart(4, '0'); }
function nextEstimateNumber() {
  let max = 0;
  estimates.forEach(e => { const m = /^\d+$/.test(String(e.estimate_number||'')) ? parseInt(e.estimate_number, 10) : 0; if (m > max) max = m; });
  return padEstNumber(max + 1);
}

// ---------- math: computed, never stored ----------
function estLineAmount(l, subtotal) {
  if (l.is_percent) return (Number(l.unit_price || 0) / 100) * subtotal;
  return Number(l.quantity || 0) * Number(l.unit_price || 0);
}
function estSubtotal(lines) {
  return lines.filter(l => !l.is_percent).reduce((s, l) => s + Number(l.quantity || 0) * Number(l.unit_price || 0), 0);
}
function estPercentSum(lines) {
  const sub = estSubtotal(lines);
  return lines.filter(l => l.is_percent).reduce((s, l) => s + (Number(l.unit_price || 0) / 100) * sub, 0);
}
function estGrandTotal(lines) { return estSubtotal(lines) + estPercentSum(lines); }

// ---------- dispatcher ----------
function renderEstimates() {
  if (estMode === 'edit') renderEstEditor(); else renderEstList();
}

// ==================================================================
// LIST VIEW
// ==================================================================
function renderEstList() {
  const el = document.getElementById('view-estimates');
  const cards = estimates.map(e => {
    const cli = clientById(e.client_id);
    const items = estItemsFor(e.id);
    const total = estGrandTotal(items);
    return `<div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;flex-wrap:wrap;gap:6px">
        <strong>#${esc(e.estimate_number)} <span style="color:var(--muted);font-weight:400">·</span> ${esc(cli ? cli.name : '—')}</strong>
        <span class="row-actions">
          <button class="btn tiny secondary" onclick="estOpenEdit('${e.id}')">Edit</button>
          <button class="btn tiny secondary" onclick="printEstimate('${e.id}')">🖨 Print</button>
          <button class="btn tiny secondary" onclick="deleteEstimate('${e.id}')">✕</button>
        </span>
      </div>
      <div style="margin-bottom:6px">${esc(e.title || '')}</div>
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px;font-size:13px;color:var(--muted)">
        <span>Issued ${fmtDate(e.issue_date)}${e.valid_until ? ' · valid until ' + fmtDate(e.valid_until) : ''}</span>
        <span><span class="est-status ${esc(e.status||'draft')}">${esc(e.status || 'draft')}</span>
          <strong style="color:var(--text);margin-left:8px">${fmtMoney(total)}</strong> · ${items.length} line${items.length===1?'':'s'}</span>
      </div>
    </div>`;
  }).join('');

  el.innerHTML = `
    <div class="view-title">Estimates
      <button class="btn" onclick="estOpenNew()">＋ New Estimate</button>
    </div>
    ${estimates.length ? cards : '<div class="empty">No estimates yet — create your first one.</div>'}`;
}

function estBlankLine() { return { item_type: 'Labor', description: '', quantity: 1, unit: 'hr', unit_price: '', is_percent: false }; }

function estOpenNew() {
  estMode = 'edit'; editingEstimateId = null; estLines = [estBlankLine()];
  renderEstimates();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function estOpenEdit(id) {
  const e = estimates.find(x => x.id === id); if (!e) return;
  estMode = 'edit'; editingEstimateId = id;
  estLines = estItemsFor(id).map(i => ({
    item_type: i.item_type || 'Labor', description: i.description || '',
    quantity: i.quantity, unit: i.unit || '', unit_price: i.unit_price, is_percent: !!i.is_percent
  }));
  if (!estLines.length) estLines = [estBlankLine()];
  renderEstimates();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function estBackToList() {
  estMode = 'list'; editingEstimateId = null; estLines = [];
  estLoadAndRender();
}

// ---------- dropdowns ----------
function estClientOptions(selectedId) {
  let out = '<option value="">Select client…</option>';
  clients.forEach(c => { out += `<option value="${c.id}"${c.id === selectedId ? ' selected':''}>${esc(c.name)}</option>`; });
  return out;
}
function estProjectOptions(clientId, selectedId) {
  let out = '<option value="">— none —</option>';
  if (clientId) {
    projects.filter(p => p.client_id === clientId).forEach(p => {
      out += `<option value="${p.id}"${p.id === selectedId ? ' selected':''}>${esc(p.name)}</option>`;
    });
  }
  return out;
}

// ---------- line items ----------
// state lives in estLines; inputs write back without re-rendering the table
function estAutoGrow(el) {
  if (!el || el.tagName !== 'TEXTAREA') return;
  el.style.height = 'auto';
  el.style.height = Math.max(38, el.scrollHeight) + 'px';
}
function estRenderLines() {
  const host = document.getElementById('es-lines');
  if (!host) return;
  host.innerHTML = estLinesTable();
  host.querySelectorAll('textarea').forEach(estAutoGrow);
  refreshEstAmounts();
}
function estLinesTable() {
  return `
  <table class="est-lines">
    <thead><tr>
      <th style="min-width:130px">Type</th><th>Description</th>
      <th style="width:70px">Qty</th><th style="width:80px">Unit</th>
      <th style="width:95px">Rate / %</th>
      <th style="text-align:right;width:115px">Amount</th>
      <th style="width:74px;text-align:center">％<br><span style="font-weight:400;font-size:10px">(of sub)</span></th><th></th>
    </tr></thead>
    <tbody>
    ${estLines.map((l, i) => {
      const amt = estLineAmount(l, estSubtotal(estLines));
      const types = EST_TYPES.includes(l.item_type) ? EST_TYPES : EST_TYPES.concat([l.item_type]);
      const opts = types.map(t => `<option value="${esc(t)}"${t === l.item_type ? ' selected':''}>${esc(t)}</option>`).join('')
        + '<option value="__new__">＋ New type…</option>';
      return `<tr>
        <td><select onchange="estTypeChange(${i}, this.value, this)">${opts}</select></td>
        <td class="est-desc"><textarea rows="1" placeholder="Description — Enter for a new line"
          oninput="estLineInput(${i}, 'description', this.value, this)">
${esc(l.description)}</textarea></td>
        <td><input type="number" step="0.25" min="0" inputmode="decimal" value="${l.quantity ?? ''}" ${l.is_percent ? 'disabled' : ''} oninput="estLineInput(${i}, 'quantity', this.value)"></td>
        <td><input type="text" value="${esc(l.unit || '')}" placeholder="hr" ${l.is_percent ? 'disabled' : ''} oninput="estLineInput(${i}, 'unit', this.value)"></td>
        <td><input type="number" step="0.01" inputmode="decimal" value="${l.unit_price ?? ''}" oninput="estLineInput(${i}, 'unit_price', this.value)"></td>
        <td class="est-amt" data-i="${i}" style="text-align:right;font-weight:600;white-space:nowrap">${fmtMoney(amt)}</td>
        <td style="text-align:center"><input type="checkbox" style="width:auto" ${l.is_percent ? 'checked' : ''} onchange="estTogglePct(${i}, this.checked)"></td>
        <td style="text-align:right"><button class="btn tiny secondary" onclick="estDelLine(${i})">✕</button></td>
      </tr>`;
    }).join('')}
    </tbody>
  </table>`;
}
function estLineInput(i, field, value, el) {
  estLines[i][field] = (field === 'quantity' || field === 'unit_price') ? (value === '' ? '' : parseFloat(value)) : value;
  if (el) estAutoGrow(el);
  refreshEstAmounts();
}
function estTypeChange(i, val, sel) {
  if (val === '__new__') {
    const t = prompt('New line type / category name:');
    if (t && t.trim()) {
      const name = t.trim();
      if (!EST_TYPES.includes(name)) EST_TYPES.push(name); // persists via the DB once this estimate is saved
      estLines[i].item_type = name;
      estRenderLines();
    } else {
      sel.value = estLines[i].item_type; // undo
    }
    return;
  }
  estLines[i].item_type = val;
}
function estTogglePct(i, on) {
  estLines[i].is_percent = on;
  if (on && estLines[i].item_type === 'Labor') estLines[i].item_type = 'Overhead & Profit'; // convenience, not enforced
  estRenderLines(); // needed to toggle the disabled qty/unit inputs
}
function estAddLine() {
  estLines.push(estBlankLine());
  estRenderLines();
}
function estDelLine(i) {
  estLines.splice(i, 1);
  estRenderLines();
}
function refreshEstAmounts() {
  const subtotal = estSubtotal(estLines), pct = estPercentSum(estLines);
  const g = id => document.getElementById(id);
  if (g('es-subtotal')) g('es-subtotal').textContent = fmtMoney(subtotal);
  if (g('es-pctsum')) g('es-pctsum').textContent = fmtMoney(pct);
  if (g('es-total')) g('es-total').textContent = fmtMoney(subtotal + pct);
  document.querySelectorAll('#es-lines .est-amt').forEach(td => {
    const i = Number(td.dataset.i);
    if (estLines[i]) td.textContent = fmtMoney(estLineAmount(estLines[i], subtotal));
  });
}

// ---------- save ----------
async function saveEstimate(btn) {
  const clientId = document.getElementById('es-client').value;
  if (!clientId) { toast('Select a client'); return; }
  const issue = document.getElementById('es-issue').value;
  if (!issue) { toast('Issue date required'); return; }

  const payload = {
    client_id: clientId,
    project_id: document.getElementById('es-project').value || null,
    title: document.getElementById('es-title').value.trim(),
    issue_date: issue,
    valid_until: document.getElementById('es-valid').value || null,
    status: document.getElementById('es-status').value,
    notes: document.getElementById('es-notes').value.trim() || null,
    updated_at: new Date().toISOString(),
  };

  btn.disabled = true; btn.textContent = 'Saving…';
  try {
    let estId;
    if (editingEstimateId) {
      const { error } = await db.from('estimates').update(payload).eq('id', editingEstimateId);
      if (error) { toast(error.message); return; }
      estId = editingEstimateId;
    } else {
      // sequential numbering with retry — the DB UNIQUE constraint is the referee
      let num = nextEstimateNumber(), saved = false;
      for (let attempt = 0; attempt < 3 && !saved; attempt++) {
        const { data, error } = await db.from('estimates').insert({ ...payload, estimate_number: num }).select('id').single();
        if (!error) { estId = data.id; saved = true; }
        else if (/unique|duplicate/i.test(error.message)) num = padEstNumber(parseInt(num, 10) + 1);
        else { toast(error.message); return; }
      }
      if (!saved) { toast('Could not assign an estimate number — try again'); return; }
    }

    // rewrite all lines (simple & robust — tables are small)
    const { error: delErr } = await db.from('estimate_items').delete().eq('estimate_id', estId);
    if (delErr) { toast(delErr.message); return; }
    const rows = estLines.map((l, pos) => ({
      estimate_id: estId,
      position: pos,
      item_type: l.item_type,
      description: l.description || '',
      quantity: l.is_percent ? 1 : (Number(l.quantity) || 0),
      unit: l.is_percent ? null : (l.unit || null),
      unit_price: Number(l.unit_price) || 0,
      is_percent: !!l.is_percent,
    }));
    if (rows.length) {
      const { error: insErr } = await db.from('estimate_items').insert(rows);
      if (insErr) { toast(insErr.message); return; }
    }

    estMode = 'list'; editingEstimateId = null; estLines = [];
    await estLoadAndRender();
    toast('Estimate saved');
  } finally {
    btn.disabled = false; btn.textContent = 'Save Estimate';
  }
}

async function deleteEstimate(id) {
  const e = estimates.find(x => x.id === id);
  if (!confirm(`Delete estimate #${e ? e.estimate_number : ''} and its line items?`)) return;
  const { error: d1 } = await db.from('estimate_items').delete().eq('estimate_id', id);
  if (d1) { toast(d1.message); return; }
  const { error: d2 } = await db.from('estimates').delete().eq('id', id);
  if (d2) { toast(d2.message); return; }
  if (editingEstimateId === id) { estMode = 'list'; editingEstimateId = null; estLines = []; }
  await estLoadAndRender();
  toast('Estimate deleted');
}

  if (!d) return '';
  const parts = String(d).split('-');

}

  const e = estimates.find(x => x.id === id);
  if (!e) return;

      <div>
        <strong>Prepared for:</strong><br>
        ${esc(cli ? cli.name : '')}<br>
        <span style="white-space:pre-wrap">${esc((cli && cli.address) || '')}</span>
      </div>
      <div style="text-align:right">
         Issue date: ${estFmtMDY(e.issue_date)}<br>
         ${e.valid_until ? 'Valid until: ' + estFmtMDY(e.valid_until) + '<br>' : ''}
      </div>
    </div>
    ${e.title ? `<h2>${esc(e.title)}</h2>` : ''}
    <table>
      <thead><tr><th>Type</th><th>Description</th><th style="text-align:right">Qty</th><th>Unit</th><th style="text-align:right">Rate</th><th style="text-align:right">Amount</th></tr></thead>
      <tbody>${rows}</tbody>

    <p class="totals-row">Subtotal: ${fmtMoney(subtotal)}<br>

// ---------- constants & state ----------
const INV_BUSINESS_NAME = (typeof EST_BUSINESS_NAME !== 'undefined' && EST_BUSINESS_NAME) || '4th Generation';
const INV_STATUSES = ['draft', 'sent', 'paid', 'void'];
// label, meaning — schema check constraint still allows all three values
const INV_GROUPINGS = [
  ['detail',     'Detail — every entry + notes'],
  ['by_task',    'Labor by task — expenses detailed'],
  ['by_category','Labor one line — expenses by category'],
];

let invoices = [], invoiceItems = [];
let invMode = 'list';
let editingInvoiceId = null;
let invExtra = [];        // manual adjustment lines {description, amount}
let invOhpPct = 0;        // % applied to JOB COST subtotal
let pdfLibsLoading = null;

// ---------- fetch / hooks ----------
async function fetchInvoices() {
  const { data, error } = await db.from('invoices').select('*').order('invoice_number', { ascending: false }).limit(500);
  if (error) { toast('invoices: ' + error.message); return []; }
  return data || [];
}
async function fetchInvoiceItems() {
  const { data, error } = await db.from('invoice_items').select('*');
  if (error) { toast('invoice_items: ' + error.message); return []; }
  return data || [];
}
function invItemsFor(invId) { return invoiceItems.filter(i => i.invoice_id === invId).sort((a,b) => (a.position||0)-(b.position||0)); }
function invoiceById(id) { return invoices.find(i => i.id === id) || null; }
function invoiceNumberFor(id) { const v = invoiceById(id); return v ? v.invoice_number : '?'; }

async function invLoadAndRender() {
  [invoices, invoiceItems] = await Promise.all([fetchInvoices(), fetchInvoiceItems()]);
  timeEntries = await fetchTime();
  expenses = await fetchExpenses();
  renderInvoices();
}
document.querySelectorAll('nav button[data-view="invoices"]').forEach(btn => {
  btn.addEventListener('click', invLoadAndRender);
});

// ---------- numbering ----------
function padInvNumber(n) { return String(n).padStart(4, '0'); }
function nextInvoiceNumber() {
  let max = 0;
  invoices.forEach(v => { const m = /^\d+$/.test(String(v.invoice_number||'')) ? parseInt(v.invoice_number, 10) : 0; if (m > max) max = m; });
  return padInvNumber(max + 1);
}

// ---------- unbilled pools ----------
function invUnbilledTime(pid) { return timeEntries.filter(e => e.project_id === pid && !e.invoice_id); }
function invUnbilledExpenses(pid) { return expenses.filter(e => e.project_id === pid && !e.invoice_id); }
function invTimeValue(list) { return list.reduce((s,t) => { const r = effectiveRate(t); return s + (r != null ? (t.minutes/60)*r : 0); }, 0); }

// ---------- math (v2: O&P on job cost, deposits credited at the bottom) ----------
function invItemAmount(it) { return Number(it.quantity || 0) * Number(it.unit_price || 0); }
function invIsDeposit(i) {
  if ((i.item_type || '') === 'Deposit') return true;
  return i.source_type === 'expense' && Number(i.unit_price || 0) < 0 && !i.is_percent;
}
function invIsManual(i) { return i.source_type === 'manual'; }
function invSubtotal(items) { // JOB COST: costs + adjustments, deposits excluded
  return items.filter(i => !i.is_percent && !invIsDeposit(i)).reduce((s, i) => s + invItemAmount(i), 0);
}
function invDeposits(items) { // negative sum of deposit rows
  return items.filter(i => !i.is_percent && invIsDeposit(i)).reduce((s, i) => s + invItemAmount(i), 0);
}
function invOhpPctSum(items) {
  return items.filter(i => i.is_percent).reduce((s, i) => s + Number(i.unit_price || 0), 0);
}
function invOhp(items) { return (invOhpPctSum(items) / 100) * invSubtotal(items); }
function invTotal(items) { return invSubtotal(items) + invOhp(items); }
function invBalance(items) { return invTotal(items) + invDeposits(items); }

// ---------- dispatcher ----------
function renderInvoices() {
  if (invMode === 'edit') renderInvEditor(); else renderInvHome();
}

        <span class="row-actions">
          <button class="btn tiny secondary" onclick="invOpenEdit('${v.id}')">Open</button>
          <button class="btn tiny secondary" onclick="invPdfButton('${v.id}', this)">📄 PDF</button>
          <button class="btn tiny secondary" onclick="invDelete('${v.id}')">✕</button>
        </span>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px;font-size:13px;color:var(--muted)">

        <span><span class="inv-status ${esc(v.status||'draft')}">${esc(v.status || 'draft')}</span>
          <strong class="${bal < 0 ? 'inv-amt-neg' : 'inv-amt-pos'}" style="margin-left:8px;color:var(--text)">Balance ${fmtMoney(bal)}</strong>
          ${v.requested_amount != null ? ` · draw ${fmtMoney(v.requested_amount)}` : ''}</span>

  el.innerHTML = `
    <div class="view-title">Invoices
      <span style="font-size:14px;color:var(--muted)">${invoices.length} open</span>
    </div>
    ${poolCards || '<div class="empty">No projects with unbilled activity.</div>'}
    <div style="height:24px"></div>
    <div class="view-title" style="font-size:16px">Open Invoices</div>
    ${openCards || '<div class="empty">No invoices. Create one from a project above — deleting it later releases the hours and expenses back to unbilled.</div>'}
    <div class="inv-preview-note">Running-statement workflow: an invoice snapshots and locks everything unbilled on its project. After a draw comes in, delete the invoice and log the draw as a Deposit expense — the entries unlock automatically and the next statement shows the credit.</div>`;
}

// ==================================================================
// CREATE — with instant button feedback
// ==================================================================
async function invCreate(projectId, btn) {
  const p = projectById(projectId); if (!p) return;
  const unbT = invUnbilledTime(projectId), unbE = invUnbilledExpenses(projectId);
  if (!unbT.length && !unbE.length) { toast('Nothing unbilled on this project'); return; }

  if (btn) { btn.disabled = true; btn.textContent = 'Creating…'; }
  try {
    const payload = {
      invoice_number: nextInvoiceNumber(),
      client_id: p.client_id,
      project_id: projectId,
      issue_date: isoDate(new Date()),
      due_date: null,
      status: 'draft',
      grouping: 'by_task',
      requested_amount: null,
      title: p.name,
      notes: null,
    };

    let invId;
    let num = payload.invoice_number, saved = false;
    for (let attempt = 0; attempt < 3 && !saved; attempt++) {
      const { data, error } = await db.from('invoices').insert({ ...payload, invoice_number: num }).select('id').single();
      if (!error) { invId = data.id; saved = true; }
      else if (/unique|duplicate/i.test(error.message)) num = padInvNumber(parseInt(num, 10) + 1);
      else { toast(error.message); return; }
    }
    if (!saved) { toast('Could not assign invoice number'); return; }

    // load the fresh invoice into cache, then snapshot + stamp
    invoices = await fetchInvoices();
    const pulled = await invPullUnbilled(invId);
    invOpenEdit(invId);
    if (pulled) toast(pulled + ' entries snapshotted & locked');
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = 'Create Invoice'; }
  }
}

// snapshot + stamp every currently-unbilled entry on the invoice's project
async function invPullUnbilled(invId) {
  const v = invoiceById(invId);
  if (!v || !v.project_id) return 0;
  const pid = v.project_id;
  const unbT = invUnbilledTime(pid), unbE = invUnbilledExpenses(pid);
  if (!unbT.length && !unbE.length) { toast('Already up to date'); return 0; }

  const existing = invItemsFor(invId);
  let pos = existing.reduce((m, i) => Math.max(m, i.position || 0), -1) + 1;

  const rows = [];
  unbT.forEach(t => {
    const task = t.task_id ? taskById(t.task_id) : null;
    const rate = effectiveRate(t) || 0;
    rows.push({
      invoice_id: invId, position: pos++, source_type: 'time', source_entry_id: t.id,
      description: task ? task.name : 'Labor', item_type: 'Labor',
      item_notes: t.notes || '',
      quantity: Number((t.minutes / 60).toFixed(4)), unit: 'hr', unit_price: rate, is_percent: false,
    });
  });
  unbE.forEach(e => {
    rows.push({
      invoice_id: invId, position: pos++, source_type: 'expense', source_entry_id: e.id,
      description: e.vendor || (e.category === 'Deposit' ? 'Deposit received' : (e.category || 'Expense')),
      item_type: e.category || 'Other',
      item_notes: (e.notes || '') + (e.expense_date ? ' · ' + fmtDate(e.expense_date) : ''),
      quantity: 1, unit: null, unit_price: Number(e.amount), is_percent: false,
    });
  });

  const { error: insErr } = await db.from('invoice_items').insert(rows);
  if (insErr) { toast(insErr.message); return 0; }

  const tIds = unbT.map(t => t.id), eIds = unbE.map(e => e.id);
  if (tIds.length) await db.from('time_entries').update({ invoice_id: invId }).in('id', tIds);
  if (eIds.length) await db.from('expenses').update({ invoice_id: invId }).in('id', eIds);

  invoiceItems = await fetchInvoiceItems();
  timeEntries = await fetchTime();
  expenses = await fetchExpenses();
  return rows.length;
}

// ==================================================================
// GROUPING — display-level only; full detail always preserved in data
// ==================================================================
function invGroupRows(v, items) {
  const time = items.filter(i => i.source_type === 'time');
  const exp  = items.filter(i => i.source_type === 'expense' && !invIsDeposit(i));
  const deps = items.filter(i => !i.is_percent && invIsDeposit(i));
  const adj  = items.filter(invIsManual).filter(i => !i.is_percent);
  const g = v.grouping || 'by_task';

  const depRow = { label: 'Deposits received', sub: deps.length + ' draw' + (deps.length===1?'':'s'), amount: deps.reduce((s,i)=>s+invItemAmount(i),0), qty: null, rate: null };

  if (g === 'detail') {
    return [
      ...time.map(i => ({ label: 'Labor', sub: i.description, notes: i.item_notes, qty: i.quantity, unit: i.unit, rate: i.unit_price, amount: invItemAmount(i) })),
      ...exp.map(i => ({ label: i.item_type || 'Expense', sub: i.description, notes: i.item_notes, qty: null, rate: null, amount: invItemAmount(i) })),
      ...deps.map(i => ({ label: 'Deposit', sub: i.description, notes: i.item_notes, amount: invItemAmount(i), qty: null, rate: null })),
      ...adj.map(i => ({ label: i.item_type || 'Adjustment', sub: i.description, notes: i.item_notes, amount: invItemAmount(i), qty: null, rate: null })),
    ];
  }
  if (g === 'by_task') {
    const byKey = {};
    time.forEach(i => {
      const k = i.description + '|' + i.unit_price;
      (byKey[k] = byKey[k] || { label: 'Labor', sub: i.description, qty: 0, unit: i.unit || 'hr', rate: i.unit_price, amount: 0 });
      byKey[k].qty += Number(i.quantity || 0);
      byKey[k].amount += invItemAmount(i);
    });
    return [
      ...Object.values(byKey),
      // expenses stay DETAILED — vendor + notes on each line
      ...exp.map(i => ({ label: i.item_type || 'Expense', sub: i.description, notes: i.item_notes, amount: invItemAmount(i), qty: null, rate: null })),
      ...(deps.length ? [depRow] : []),
      ...adj.map(i => ({ label: i.item_type || 'Adjustment', sub: i.description, amount: invItemAmount(i), qty: null, rate: null })),
    ];
  }
  // by_category — labor one line, expenses rolled by category
  const rows = [];
  if (time.length) rows.push({ label: 'Labor', sub: time.length + ' time entr' + (time.length===1?'y':'ies'),
    qty: time.reduce((s,i)=>s+Number(i.quantity||0),0), unit: 'hr',
    rate: time.every(i => Number(i.unit_price) === Number(time[0].unit_price)) ? time[0].unit_price : null,
    amount: time.reduce((s,i)=>s+invItemAmount(i),0) });
  const catExp = {};
  exp.forEach(i => { (catExp[i.item_type] = catExp[i.item_type] || { label: i.item_type || 'Expense', amount: 0 }).amount += invItemAmount(i); });
  return [
    ...rows,
    ...Object.values(catExp),
    ...(deps.length ? [depRow] : []),
    ...adj.map(i => ({ label: i.item_type || 'Adjustment', sub: i.description, amount: invItemAmount(i), qty: null, rate: null })),
  ];
}

// ---- save ----
async function invSave(btn) {
  const v = invoiceById(editingInvoiceId); if (!v) return;
  btn.disabled = true; btn.textContent = 'Saving…';
  try {
    const upd = {
      issue_date: document.getElementById('iv-issue').value || v.issue_date,
      due_date: document.getElementById('iv-due').value || null,
      status: document.getElementById('iv-status').value,
      requested_amount: document.getElementById('iv-requested').value === '' ? null : Number(document.getElementById('iv-requested').value),
      notes: document.getElementById('iv-notes').value.trim() || null,
      grouping: document.getElementById('iv-grouping').value,
      updated_at: new Date().toISOString(),
    };
    const { error } = await db.from('invoices').update(upd).eq('id', v.id);
    if (error) { toast(error.message); return; }

    // rewrite manual + percent lines
    const { error: dErr } = await db.from('invoice_items').delete().eq('invoice_id', v.id).eq('source_type', 'manual');
    if (dErr) { toast(dErr.message); return; }
    const snapshotMax = invItemsFor(v.id).filter(i => !invIsManual(i)).reduce((m, i) => Math.max(m, i.position || 0), -1);
    const rows = [];
    let pos = snapshotMax + 1;
    if (invOhpPct > 0) {
      rows.push({ invoice_id: v.id, position: pos++, source_type: 'manual', source_entry_id: null,
        description: 'Overhead & Profit', item_type: 'Overhead & Profit', item_notes: '',
        quantity: 1, unit: null, unit_price: invOhpPct, is_percent: true });
    }
    invExtra.forEach(x => {
      if (x.description && Number(x.amount)) {
        rows.push({ invoice_id: v.id, position: pos++, source_type: 'manual', source_entry_id: null,
          description: x.description, item_type: 'Adjustment', item_notes: '',
          quantity: 1, unit: null, unit_price: Number(x.amount), is_percent: false });
      }
    });
    if (rows.length) {
      const { error: iErr } = await db.from('invoice_items').insert(rows);
      if (iErr) { toast(iErr.message); return; }
    }
    await invLoadAndRender();
    toast('Invoice saved');
  } finally {
    btn.disabled = false; btn.textContent = 'Save Invoice';
  }
}

async function invDelete(id) {
  const v = invoiceById(id);
  if (!confirm(`Delete invoice #${v ? v.invoice_number : ''}? All its hours and expenses unlock and return to unbilled.`)) return;
  const { error } = await db.from('invoices').delete().eq('id', id);
  if (error) { toast(error.message); return; }
  if (editingInvoiceId === id) { invMode = 'list'; editingInvoiceId = null; }
  await invLoadAndRender();
  toast('Invoice deleted — entries unlocked');
}

// ==================================================================
// LOCKING GUARDS (unchanged from v1)
// ==================================================================
function invLockedToast(kind, id) {
  const src = kind === 'time' ? timeEntries.find(t => t.id === id) : expenses.find(e => e.id === id);
  if (!src || !src.invoice_id) return false;
  toast('🔒 Locked — billed on invoice #' + invoiceNumberFor(src.invoice_id) + '. Delete that invoice to unlock.');
  return true;
}
(function invInstallGuards() {
  if (typeof deleteTime === 'function') {
    const orig = window.deleteTime;
    window.deleteTime = function (id) { if (invLockedToast('time', id)) return; return orig.call(this, id); };
  }
  if (typeof editExpense === 'function') {
    const orig = window.editExpense;
    window.editExpense = function (id) { if (invLockedToast('expense', id)) return; return orig.call(this, id); };
  }
  if (typeof editExpenseSwitchTab === 'function') {
    const orig = window.editExpenseSwitchTab;
    window.editExpenseSwitchTab = function (id) { if (invLockedToast('expense', id)) return; return orig.call(this, id); };
  }
  if (typeof deleteExpense === 'function') {
    const orig = window.deleteExpense;
    window.deleteExpense = function (id) { if (invLockedToast('expense', id)) return; return orig.call(this, id); };
  }
  if (typeof saveCellInternal === 'function') {
    const orig = window.saveCellInternal;
    window.saveCellInternal = function (input) {
      const taskId = input.dataset.task, date = input.dataset.date;
      const stamped = timeEntries.find(e => e.task_id === taskId && e.entry_date === date && e.invoice_id);
      if (stamped) {
        toast('🔒 Hours on ' + date + ' are billed on invoice #' + invoiceNumberFor(stamped.invoice_id) + ' — delete that invoice to edit');
        input.value = input.dataset.originalValue || '';
        return;
      }
      return orig.call(this, input);
    };
  }
  if (typeof renderWeekGrid === 'function') {
    const orig = window.renderWeekGrid;
    window.renderWeekGrid = async function () {
      await orig.call(this);
      document.querySelectorAll('#time-body .cell-input').forEach(inp => {
        const stamped = timeEntries.find(e => e.task_id === inp.dataset.task && e.entry_date === inp.dataset.date && e.invoice_id);
        if (stamped) { inp.disabled = true; inp.style.opacity = .45; inp.title = 'Billed on invoice #' + invoiceNumberFor(stamped.invoice_id); }
      });
    };
  }
  // VENDOR NOW OPTIONAL: override saveExpense with the same body, minus the
  // "Vendor required" check (label on the form stays "Vendor").
  window.saveExpense = async function () {
    const date = document.getElementById('e-date').value;
    const projectId = document.getElementById('e-project').value;
    const vendor = document.getElementById('e-vendor').value.trim();   // optional now
    const amount = parseFloat(document.getElementById('e-amount').value);
    const category = document.getElementById('e-category').value;
    const notes = document.getElementById('e-notes').value.trim();

    if (!date) { toast('Date required'); return; }
    if (!projectId) { toast('Select a project'); return; }
    if (isNaN(amount)) { toast('Amount required (use negative for deposits)'); return; }

    const btn = event ? event.target : null;
    if (btn) { btn.disabled = true; btn.textContent = 'Saving…'; }

    const proj = projectById(projectId);
    const payload = {
      project_id: projectId,
      client_id: proj ? proj.client_id : null,
      expense_date: date,
      vendor, amount, category, notes,
      updated_at: new Date().toISOString(),
    };

    let expId = editingExpenseId;
    try {
      if (editingExpenseId) {
        const { error } = await db.from('expenses').update(payload).eq('id', editingExpenseId);
        if (error) { toast(error.message); if (btn) { btn.disabled=false; btn.textContent='Save Expense'; } return; }
      } else {
        const { data, error } = await db.from('expenses').insert(payload).select('id').single();
        if (error) { toast(error.message); if (btn) { btn.disabled=false; btn.textContent='Save Expense'; } return; }
        expId = data.id;
      }

      for (const sf of stagedFiles) {
        const path = expId + '/' + Date.now() + '-' + sf.name.replace(/[^a-zA-Z0-9._-]/g,'_');
        const { error } = await db.storage.from('receipts').upload(path, sf.file, { upsert: true });
        if (error) { toast('Receipt upload failed: ' + error.message); continue; }
        const { error: e2 } = await db.from('receipt_files').insert({ expense_id: expId, storage_path: path, filename: sf.name });
        if (e2) { toast(e2.message); }
      }

      expenses = await fetchExpenses();
      receiptFiles = await fetchReceipts();
